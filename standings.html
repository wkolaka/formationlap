<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Таблица лидеров 2026 — FormationLap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <span class="sidebar-title">НАВИГАЦИЯ</span>
      <button class="sidebar-close" onclick="toggleSidebar()" aria-label="Закрыть меню">&times;</button>
    </div>
    <nav class="sidebar-links">
      <a href="index.html">Основная страница</a>
      <a href="standings.html" class="active-link">Таблица лидеров</a>
    </nav>
  </aside>

  <header>
    <div class="header-left">
      <button class="menu-dots-btn" onclick="toggleSidebar()" aria-label="Открыть меню">&#8942;</button>

      <a href="index.html" class="logo" aria-label="FormationLap">
        <svg class="logo-f" viewBox="0 0 85 50" xmlns="http://w3.org">
          <polygon points="18,6 56,6 53,16 28,16 26,22 47,22 44,31 23,31 18,45 6,45" fill="#ffffff"/>
          <polygon points="59,6 82,6 79,13 57,13" fill="#e10600"/>
          <polygon points="55,16 76,16 73,22 53,22" fill="#e10600"/>
          <polygon points="50,25 69,25 66,31 48,31" fill="#e10600"/>
          <polygon points="45,34 61,34 58,40 43,40" fill="#e10600"/>
        </svg>
        ORMATION<span>LAP</span>
      </a>
    </div>

    <nav>
      <a href="index.html#calendar">Календарь</a>
      <a href="index.html#teams">Команды</a>
      <a href="index.html#news">О проекте</a>
    </nav>
  </header>

  <main>
    <section id="standings">
      <h3>Турнирная таблица 2026</h3>

      <div class="standings-header">
        <div class="tabs">
          <button class="tab-btn active" id="tab-drivers" onclick="switchTab('drivers')">Личный зачёт</button>
          <button class="tab-btn" id="tab-constructors" onclick="switchTab('constructors')">Кубок конструкторов</button>
        </div>
        <div class="sync-status" id="sync-status">Синхронизация данных...</div>
      </div>

      <div id="panel-drivers">
        <table>
          <thead>
            <tr>
              <th>Поз.</th>
              <th>Пилот</th>
              <th>Команда</th>
              <th>Победы</th>
              <th>Очки</th>
            </tr>
          </thead>
          <tbody id="drivers-body"></tbody>
        </table>
        <button class="toggle-more" id="toggle-drivers-btn" onclick="toggleAllDrivers()">Показать всех пилотов (25)</button>
      </div>

      <div id="panel-constructors" class="hidden">
        <table>
          <thead>
            <tr>
              <th>Поз.</th>
              <th>Команда</th>
              <th>Победы</th>
              <th>Очки</th>
            </tr>
          </thead>
          <tbody id="constructors-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 FormationLap — Фан-сайт Формулы-1</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
